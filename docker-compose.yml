services:
  backend:
    build: .
    container_name: pai_hire_backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./outputs:/app/outputs
      - ./ats_phongvan.db:/app/ats_phongvan.db
      - ./JDs:/app/JDs
      - ./JDs_Detailed:/app/JDs_Detailed
      - ./Generated_Questions:/app/Generated_Questions
      - ./Generated_Audio:/app/Generated_Audio
    env_file:
      - .env
    environment:
      - PORT=8001

  frontend:
    image: nginx:alpine
    container_name: pai_hire_frontend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/usr/share/nginx/html/ui:ro
      - ./frontend_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pai_hire_ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http frontend:8000
    ports:
      - "4040:4040"
    depends_on:
      - frontend
