services:
  app:
    build: .
    container_name: pai_hire_app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/app/outputs
      - ./ats_phongvan.db:/app/ats_phongvan.db
      - ./JDs:/app/JDs
      - ./JDs_Detailed:/app/JDs_Detailed
      - ./Generated_Questions:/app/Generated_Questions
      - ./Generated_Audio:/app/Generated_Audio
    env_file:
      - .env
    environment:
      - PORT=8080

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pai_hire_ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http app:8080
    ports:
      - "4040:4040"
    depends_on:
      - app
