server {
    listen 8000;
    server_name _;

    client_max_body_size 500M;

    root /usr/share/nginx/html;

    # Frontend Static UI Files
    location /ui/ {
        alias /usr/share/nginx/html/ui/;
        expires 1d;
    }

    # Frontend HTML Pages
    location = / {
        try_files /ui/apply.html =404;
    }

    location = /interview {
        try_files /ui/interview.html =404;
    }

    location = /apply {
        try_files /ui/apply.html =404;
    }

    location ~ ^/apply/ {
        try_files /ui/apply.html =404;
    }

    location = /admin {
        try_files /ui/admin.html =404;
    }

    location = /admin/login {
        try_files /ui/admin.html =404;
    }

    location = /candidate/reply {
        if ($request_method = POST) {
            rewrite ^ /api_candidate_reply last;
        }
        try_files /ui/candidate_reply.html =404;
    }

    location = /api_candidate_reply {
        internal;
        proxy_pass http://backend:8001/candidate/reply;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(candidate/history|history) {
        try_files /ui/history.html =404;
    }

    # Proxy Backend API & Dynamic Routes to Backend (Port 8001)
    location / {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
