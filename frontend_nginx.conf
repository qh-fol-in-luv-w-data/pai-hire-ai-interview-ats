server {
    listen 8000;
    server_name _;

    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index candidate.html;

    # Tương thích các đường dẫn tài nguyên cũ.
    location /ui/ {
        alias /usr/share/nginx/html/;
        expires 1d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(code|report_print)\.html$ {
        try_files $uri =404;
    }

    # Frontend HTML Pages
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /candidate.html =404;
    }

    location = /interview {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /interview.html =404;
    }

    location = /apply {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /candidate.html =404;
    }

    location ~ ^/apply/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /candidate.html =404;
    }

    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /admin.html =404;
    }

    location ~ ^/admin/ui(?:/.*)?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /admin.html =404;
    }

    location = /candidate/reply {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        if ($request_method = POST) {
            rewrite ^ /api_candidate_reply last;
        }
        try_files /candidate.html =404;
    }

    # Compatibility for a cached pre-API-split frontend bundle. GET remains
    # the React registration page; POST is internally forwarded to its API.
    location = /enterprise/register {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        if ($request_method = POST) {
            rewrite ^ /api/enterprise/register last;
        }
        try_files /candidate.html =404;
    }

    # Same compatibility bridge for an older cached bundle that still posts
    # directly to /enterprise/login.  GET continues to render the SPA.
    location = /enterprise/login {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        if ($request_method = POST) {
            rewrite ^ /api/enterprise/login last;
        }
        try_files /candidate.html =404;
    }

    location = /api_candidate_reply {
        internal;
        proxy_pass http://backend:8001/candidate/reply;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APIs for enterprise onboarding/portal. These must precede the SPA
    # /enterprise/* fallback below or Nginx would return candidate.html.
    location ^~ /api/enterprise/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(candidate/history|history|enterprise)(?:/.*)?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /candidate.html =404;
    }

    location = /reset-password {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /candidate.html =404;
    }

    # Proxy Backend API & Dynamic Routes to Backend (Port 8001)
    location / {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
