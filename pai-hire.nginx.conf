server {
    listen 80;
    # Thay yourdomain.com bằng tên miền của bạn (ví dụ: ats.congty.com), hoặc để dấu _ nếu chỉ dùng IP
    server_name _; 

    # Giới hạn kích thước file upload (dành cho upload CV và Video phỏng vấn, ví dụ 500MB)
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSocket (nếu sau này app có dùng)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
