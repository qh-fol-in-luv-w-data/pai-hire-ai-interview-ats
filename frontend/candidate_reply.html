<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nosnippet,noarchive">
<title>Câu hỏi bổ sung — PAI Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/choices.js@11.2.3/public/assets/styles/choices.min.css" rel="stylesheet">
<link href="/ui/pai-theme.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/choices.js@11.2.3/public/assets/scripts/choices.min.js" defer></script>
<script src="/ui/pai-dropdowns.js" defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;min-height:100vh;color:#191b23;background:#faf8ff;display:flex;flex-direction:column}
  .topbar{width:100%;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(13,27,53,.04)}
  .brand{font-size:20px;font-weight:800;color:#003ca3;letter-spacing:-.02em}
  .portal{font-size:14px;font-weight:700;color:#515e7c}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  main::before{content:"";position:absolute;top:-120px;right:-80px;width:380px;height:380px;background:rgba(180,197,255,.28);border-radius:999px;filter:blur(48px);z-index:0}
  main::after{content:"";position:absolute;bottom:-160px;left:-100px;width:500px;height:500px;background:rgba(216,226,255,.38);border-radius:999px;filter:blur(56px);z-index:0}
  .card{width:100%;max-width:768px;background:rgba(255,255,255,.8);border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 18px 45px rgba(0,81,213,.10);backdrop-filter:blur(14px);padding:24px;z-index:1;display:flex;flex-direction:column;gap:24px}
  .header{border-bottom:1px solid #e5e7eb;padding-bottom:20px;display:flex;flex-direction:column;gap:8px}
  h1{font-size:clamp(24px,4vw,32px);font-weight:800;line-height:1.2;color:#191b23;letter-spacing:-.02em}
  .subtitle{font-size:16px;line-height:1.65;color:#434654}
  .info-box{background:#eff6ff;color:#003ca3;border:1px solid #dbe1ff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.6;width:100%;margin-top:6px}
  .question-card,.q-block{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(13,27,53,.05);margin-bottom:24px}
  .q-label{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#191b23;letter-spacing:-.01em;text-transform:none;margin:0}
  .q-num{width:28px;height:28px;background:#dbe1ff;color:#003ca3;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
  .q-text{font-size:14px;line-height:1.65;color:#515e7c;padding-left:38px;margin:0}
  textarea{width:100%;margin-top:8px;border-radius:12px;background:#f9fafb;border:1px solid #e5e7eb;padding:16px;font:14px/1.65 Inter,sans-serif;color:#191b23;resize:vertical;min-height:120px;outline:none;transition:.15s}
  textarea:focus{border-color:#003ca3;box-shadow:0 0 0 3px rgba(0,60,163,.12)}
  textarea::placeholder{color:#9ca3af}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:stretch;border-top:1px solid #e5e7eb;padding-top:20px;margin-top:8px}
  .btn-submit{width:100%;padding:14px 24px;background:#003ca3;color:white;border:none;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px rgba(0,81,213,.18)}
  .btn-submit:hover{background:#0051d5}.btn-submit:disabled{opacity:.55;cursor:not-allowed}
  .success{text-align:center;padding:44px 20px}.success .icon{font-size:52px;margin-bottom:16px}.success h2{font-size:22px;font-weight:800;color:#16a34a;margin-bottom:10px}.success p{color:#515e7c;font-size:14px;line-height:1.7}
  .loading{text-align:center;padding:72px 20px;color:#515e7c}.spin{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
  .err{color:#93000a;background:#ffdad6;border:1px solid rgba(186,26,26,.2);border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px}.field-error{border-color:#dc2626!important;box-shadow:0 0 0 3px rgba(220,38,38,.12)!important}
  .divider{border:none;border-top:1px solid #e5e7eb;margin:24px 0}.note{font-size:12px;color:#737686;line-height:1.6;text-align:center}
  @media(min-width:640px){.actions{flex-direction:row;justify-content:flex-end;align-items:center}.btn-submit{width:auto}.note{text-align:left;margin-right:auto}}
  @media(max-width:600px){main{padding:16px}.card{padding:20px}.question-card,.q-block{padding:18px}.q-text{padding-left:0}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">PAI Recruitment</div>
  <div class="portal">Candidate Portal</div>
</header>
<main>
<div class="card">
  <div class="header">
    <h1>Câu hỏi bổ sung</h1>
    <p class="subtitle">Vui lòng bổ sung thông tin theo các câu hỏi bên dưới để đội ngũ tuyển dụng có thêm cơ sở đánh giá hồ sơ.</p>
    <div class="info-box">Thời gian dự kiến: 15-20 phút</div>
  </div>
  <div id="content">
    <div class="loading"><span class="spin">↻</span> Đang tải câu hỏi...</div>
  </div>
</div>
</main>
<script>
const ref = new URLSearchParams(location.search).get('ref');
const API = location.origin;
let questions = [];

async function load() {
  if (!ref) {
    document.getElementById('content').innerHTML = '<div class="err">Đường link không hợp lệ. Vui lòng kiểm tra lại email.</div>';
    return;
  }
  try {
    const r = await fetch(`${API}/candidate/questions?ref=${encodeURIComponent(ref)}`);
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    questions = data.questions || [];

    if (data.already_replied) {
      showSuccess(true);
      return;
    }

    const job = (data.job_id || '').replace(/_/g,' ');
    let html = `
      <div class="info-box">
        Chào <strong>${data.name || 'Ứng viên'}</strong>,<br>
        Cảm ơn bạn đã ứng tuyển vị trí <strong>${job}</strong>. Vui lòng trả lời <strong>${questions.length} câu hỏi</strong> dưới đây để đội ngũ tuyển dụng có thêm cơ sở đánh giá mức độ phù hợp với yêu cầu công việc.
      </div>
      <div id="error-msg"></div>
    `;
    questions.forEach((q, i) => {
      html += `
        <div class="q-block">
          <div class="q-label"><span class="q-num">${i+1}</span> Câu hỏi ${i+1}/${questions.length}</div>
          <p class="q-text">${q.question_text || q.text || ''}</p>
          <textarea id="ans-${i}" placeholder="Nhập câu trả lời của bạn tại đây..." rows="4"></textarea>
        </div>
      `;
    });
    html += `
      <hr class="divider">
      <div id="submit-error-msg"></div>
      <button class="btn-submit" id="btn-send" onclick="submitReply()">Nộp câu trả lời</button>
      <p class="note" style="margin-top:12px">Câu trả lời chỉ được gửi một lần duy nhất — hãy kiểm tra kỹ trước khi nộp.</p>
    `;
    document.getElementById('content').innerHTML = html;
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="err">Lỗi tải dữ liệu: ${e.message}</div>`;
  }
}

async function submitReply() {
  const errEl = document.getElementById('error-msg');
  const submitErrEl = document.getElementById('submit-error-msg') || errEl;
  const answers = questions.map((_, i) => (document.getElementById(`ans-${i}`)?.value || '').trim());

  document.querySelectorAll('textarea').forEach(t => t.classList.remove('field-error'));
  const missingIndex = answers.findIndex(a => !a);
  if (missingIndex >= 0) {
    const msg = '<div class="err">⚠️ Vui lòng nhập câu trả lời cho tất cả câu hỏi trước khi nộp.</div>';
    errEl.innerHTML = msg;
    submitErrEl.innerHTML = msg;
    const firstMissing = document.getElementById(`ans-${missingIndex}`);
    if (firstMissing) {
      firstMissing.classList.add('field-error');
      firstMissing.focus();
      firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }
  errEl.innerHTML = '';
  submitErrEl.innerHTML = '';

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  btn.textContent = 'Đang gửi...';

  try {
    const r = await fetch(`${API}/candidate/reply`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ref, answers })
    });
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch {}
    if (!r.ok) {
      throw new Error(data.detail || text || 'Server không nhận được câu trả lời.');
    }
    if (data.ok) {
      showSuccess(data.already_done);
      return;
    }
    errEl.innerHTML = '<div class="err">Lỗi khi gửi. Vui lòng thử lại.</div>';
    submitErrEl.innerHTML = errEl.innerHTML;
  } catch(e) {
    const msg = `<div class="err">Lỗi mạng: ${e.message}</div>`;
    errEl.innerHTML = msg;
    submitErrEl.innerHTML = msg;
  }
  btn.disabled = false;
  btn.textContent = 'Nộp câu trả lời';
}

function showSuccess(alreadyDone) {
  document.getElementById('content').innerHTML = `
    <div class="success">
      <div class="icon">✅</div>
      <h2>${alreadyDone ? 'Đã ghi nhận trước đó' : 'Gửi thành công!'}</h2>
      <p>${alreadyDone
        ? 'Câu trả lời của bạn đã được ghi nhận từ trước. Đội tuyển dụng sẽ liên hệ với bạn trong thời gian sớm nhất.'
        : 'Cảm ơn bạn đã dành thời gian trả lời! Đội tuyển dụng PAI HR sẽ xem xét và liên hệ với bạn trong thời gian sớm nhất.'
      }</p>
    </div>
  `;
}

load();
</script>
</body>
</html>
